# Dependency vulnerability scanning + automated update PRs (#82).
#
# Dependabot's "npm" ecosystem covers pnpm workspaces too (it reads
# pnpm-lock.yaml) — one entry per workspace root that has its own
# package.json, per Dependabot's requirement that each directory be
# declared explicitly (it does not recurse into pnpm-workspace.yaml's
# glob patterns on its own).
version: 2

updates:
  # Root workspace + hoisted/shared devDependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Patch/minor updates across the whole tree are batched into one PR
      # per run instead of one-PR-per-package, per the issue's "Group
      # related updates in single PR" requirement. Majors stay ungrouped
      # so each gets its own PR and its own review — a major bump is far
      # more likely to need code changes than a coordinated group merge.
      patch-and-minor:
        update-types: ["patch", "minor"]
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/apps/backend/gateway"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"

