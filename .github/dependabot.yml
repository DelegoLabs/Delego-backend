  # CI workflow action versions — a stale/unpinned action is itself a
  # supply-chain risk, in scope for the same reason npm deps are.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
