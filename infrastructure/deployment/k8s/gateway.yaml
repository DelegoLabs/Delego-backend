# Gateway Deployment & Service (Issue #76)
# Health probes use the shared /health/live (liveness) and /health/ready (readiness)
# endpoints. Readiness returns 503 when a critical dependency (DB/Redis) is down,
# so the Service stops routing traffic without restarting the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delego-gateway
  labels:
    app: delego
    service: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delego
      service: gateway
  template:
    metadata:
      labels:
        app: delego
        service: gateway
    spec:
      containers:
        - name: gateway
          image: ghcr.io/delegolabs/delego-backend/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: GATEWAY_PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: delego-db
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: delego-redis
                  key: url
            - name: ORCHESTRATOR_SERVICE_URL
              value: http://delego-orchestrator:3010
            - name: WALLET_SERVICE_URL
              value: http://delego-wallet:3012
            - name: PAYMENTS_SERVICE_URL
              value: http://delego-payments:3014
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: delego-gateway
  labels:
    app: delego
    service: gateway
spec:
  selector:
    app: delego
    service: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
